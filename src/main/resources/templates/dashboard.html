<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
            margin-top:100px;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        button{
            padding:10px 20px;
            background:red;
            color:white;
            border:none;
            cursor:pointer;
            margin-top:20px;
        }

    </style>

</head>
<body>

<div class="box">

    <h1>Welcome To Dashboard</h1>

    <p>You are successfully logged in.</p>

    <form method="post" action="/logout">

        <button type="submit">
            Logout
        </button>

    </form>

</div>

</body>
</html>
