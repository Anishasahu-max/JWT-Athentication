<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .container {
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: blue;
            color: white;
            border: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <input type="text"
           id="userName"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button onclick="login()">Login</button>

</div>

<script>

    async function login() {

        const response = await fetch("/authenticate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                userName: document.getElementById("userName").value,

                password: document.getElementById("password").value
            })
        });

        const token = await response.text();

        console.log(token);

        alert("JWT Token Generated");

        localStorage.setItem("jwtToken", token);

        window.location.href = "/user/dashboard";
    }

</script>

</body>

</html>
