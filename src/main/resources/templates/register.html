<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .container {
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: green;
            color: white;
            border: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Register</h2>

    <form method="post" action="/user/register">

        <input type="text"
               name="userName"
               placeholder="Enter Username">

        <input type="email"
               name="email"
               placeholder="Enter Email">

        <input type="password"
               name="password"
               placeholder="Enter Password">

        <button type="submit">Register</button>

    </form>

</div>

</body>

</html>
